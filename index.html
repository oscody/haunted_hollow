<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <meta name="theme-color" content="#0c0a12" />
    <title>Hollow House</title>
    <style>
      :root {
        --ink: #ece6f2;
        --paper: rgba(14, 11, 20, 0.92);
        --gold: #5f8f55;
        --red: #d9621a;
      }
      body { margin: 0; overflow: hidden; background: #04343f; font-family: Georgia, serif; color: var(--ink); }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #ui-root > * { pointer-events: auto; }
      [hidden] { display: none !important; }
      button {
        font: inherit; font-size: 15px; padding: 9px 18px; border-radius: 6px; cursor: pointer;
        border: 1px solid var(--gold); background: var(--paper); color: var(--ink);
      }
      button.primary { background: var(--red); border-color: var(--red); color: #1a0d04; font-weight: 600; }
      button:hover { filter: brightness(1.06); }
      .card {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(440px, calc(100vw - 32px)); box-sizing: border-box; padding: 28px 30px 22px;
        background: var(--paper); border: 1px solid var(--gold); border-radius: 12px; text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 60px rgba(95, 143, 85, 0.15); line-height: 1.5;
      }
      .seal {
        display: inline-block; margin: 0; padding: 2px 14px; font-size: 30px;
        color: #1a0d04; background: var(--red); border-radius: 50%;
      }
      .card h1 { margin: 12px 0 2px; font-size: 30px; font-weight: 600; }
      .card .sub { margin: 0 0 12px; font-style: italic; opacity: 0.75; }
      .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; }
      .foot { margin: 14px 0 0; font-size: 13px; opacity: 0.6; }
      #hud {
        position: absolute; left: 16px; top: 16px; width: 250px; padding: 12px 16px;
        background: var(--paper); border: 1px solid var(--gold); border-radius: 10px; font-size: 14px;
      }
      #hud h2 { margin: 0; font-size: 18px; }
      #hud h2 span { font-size: 14px; font-weight: normal; opacity: 0.7; }
      #count { margin: 4px 0 8px; opacity: 0.75; }
      #list { margin: 0; padding: 0; list-style: none; }
      #list li { padding: 5px 0 5px 22px; position: relative; border-top: 1px solid rgba(95, 143, 85, 0.3); }
      #list li::before { content: '○'; position: absolute; left: 2px; color: var(--gold); }
      #list li.done::before { content: '●'; color: var(--red); }
      #list li.done { opacity: 0.6; }
      #list b { color: var(--red); font-weight: 600; margin-right: 4px; }
      #list small { display: block; opacity: 0.65; font-size: 12px; }
      #help {
        position: absolute; left: 16px; bottom: 16px; margin: 0; padding: 6px 10px; font-size: 13px;
        background: rgba(14, 11, 20, 0.75); color: var(--ink); border-radius: 6px;
      }
      #tools { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; }
      #toast {
        position: absolute; left: 50%; bottom: 64px; transform: translate(-50%, 10px); margin: 0;
        max-width: min(560px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 8px; text-align: center;
        background: rgba(14, 11, 20, 0.88); color: var(--ink); opacity: 0; transition: opacity 0.4s, transform 0.4s;
        pointer-events: none;
      }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      @media (max-width: 640px) {
        #hud { width: auto; right: 16px; }
        #list small { display: none; }
        #help { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <div id="ui-root"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
